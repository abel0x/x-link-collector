name: release

# Tag a version and the archives build themselves:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the job that creates the release may write.
permissions:
  contents: read

jobs:
  archives:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # id-token and attestations: to sign where each archive was built.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one static binary runs on every distribution -- Debian,
          # Ubuntu, Fedora, Arch, Alpine -- with no glibc version to match.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, label: linux-x86_64,   ext: "" }
          # One Mac builds both architectures and joins them with lipo: one
          # download for Intel and Apple silicon, and one macOS runner to wait
          # for instead of two (they are the scarce ones).
          - { os: macos-latest,   target: universal-apple-darwin,    label: macos-universal, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    label: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      # Third-party actions are pinned to a commit, not a movable tag.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path receiver/Cargo.toml
      - name: build (universal macOS)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          for arch in aarch64 x86_64; do
            cargo build --release --locked --target "$arch-apple-darwin" --manifest-path receiver/Cargo.toml
          done
          out=receiver/target/universal-apple-darwin/release
          mkdir -p "$out"
          lipo -create -output "$out/x-link-receiver" \
            receiver/target/aarch64-apple-darwin/release/x-link-receiver \
            receiver/target/x86_64-apple-darwin/release/x-link-receiver
          lipo -info "$out/x-link-receiver"

      # The whole kit, not just the binary: the receiver finds tools/ next to
      # itself, and the extension is loaded from the extension/ folder inside.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          staging="x-link-collector-${{ matrix.label }}"
          mkdir -p "$staging/docs"
          cp "receiver/target/${{ matrix.target }}/release/x-link-receiver" "$staging/"
          cp -R tools extension packaging "$staging/"
          cp docs/downloader.md docs/flatten.md "$staging/docs/"
          cp LICENSE NOTICE README.md CHANGELOG.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "x-link-collector-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path "$staging/docs" | Out-Null
          Copy-Item "receiver/target/${{ matrix.target }}/release/x-link-receiver.exe" $staging
          Copy-Item tools, extension, packaging "$staging" -Recurse
          Copy-Item docs/downloader.md, docs/flatten.md "$staging/docs"
          Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  $staging.zip" |
            Out-File -Encoding ascii "$staging.zip.sha256"

      # A signed statement, kept by GitHub, that this file came from this
      # repository, this commit and this workflow: gh attestation verify.
      - name: attest where it was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            x-link-collector-*.tar.gz
            x-link-collector-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  extension:
    name: extension zip and Firefox add-on
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: zip the unpacked extension
        run: |
          cd extension
          zip -qr ../x-link-collector-extension.zip .
          cd ..
          shasum -a 256 x-link-collector-extension.zip > x-link-collector-extension.zip.sha256
      # Release Firefox only installs add-ons Mozilla has signed. With the
      # AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets set (an API key from
      # addons.mozilla.org), the add-on is signed as unlisted: not shown on
      # the store, installable from the release. Without them this is skipped.
      - name: sign the Firefox add-on
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "no AMO credentials; the Firefox add-on is left unsigned"
            exit 0
          fi
          npx --yes web-ext@8.10.0 sign --source-dir extension --artifacts-dir signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp signed/*.xpi x-link-collector-firefox.xpi
          shasum -a 256 x-link-collector-firefox.xpi > x-link-collector-firefox.xpi.sha256
      - name: attest where they were built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: x-link-collector-*.zip
      - name: attest where the add-on was built
        if: hashFiles('x-link-collector-firefox.xpi') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: x-link-collector-firefox.xpi
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            x-link-collector-extension.zip
            x-link-collector-extension.zip.sha256
            x-link-collector-firefox.xpi
            x-link-collector-firefox.xpi.sha256
          if-no-files-found: warn

  publish:
    name: publish release
    needs: [archives, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The release text is this version's section of CHANGELOG.md.
      - name: release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: artifacts/*
          body_path: notes.md
          draft: true
