name: release

# Tag a version and the archives build themselves:
#   git tag v1.1.0 && git push origin v1.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archives:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one static binary runs on every distribution -- Debian,
          # Ubuntu, Fedora, Arch, Alpine -- with no glibc version to match.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, label: linux-x86_64,   ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      label: macos-arm64,    ext: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,       label: macos-x86_64,   ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    label: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path receiver/Cargo.toml

      # The whole kit, not just the binary: the receiver finds tools/ next to
      # itself, and the extension is loaded from the extension/ folder inside.
      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          staging="x-link-collector-${{ matrix.label }}"
          mkdir -p "$staging/docs"
          cp "receiver/target/${{ matrix.target }}/release/x-link-receiver" "$staging/"
          cp -R tools extension "$staging/"
          cp docs/downloader.md docs/flatten.md "$staging/docs/"
          cp LICENSE NOTICE README.md CHANGELOG.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "x-link-collector-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path "$staging/docs" | Out-Null
          Copy-Item "receiver/target/${{ matrix.target }}/release/x-link-receiver.exe" $staging
          Copy-Item tools, extension "$staging" -Recurse
          Copy-Item docs/downloader.md, docs/flatten.md "$staging/docs"
          Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  $staging.zip" |
            Out-File -Encoding ascii "$staging.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  extension:
    name: extension zip and Firefox add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip the unpacked extension
        run: |
          cd extension
          zip -qr ../x-link-collector-extension.zip .
          cd ..
          shasum -a 256 x-link-collector-extension.zip > x-link-collector-extension.zip.sha256
      # Release Firefox only installs add-ons Mozilla has signed. With the
      # AMO_JWT_ISSUER / AMO_JWT_SECRET repository secrets set (an API key from
      # addons.mozilla.org), the add-on is signed as unlisted: not shown on
      # the store, installable from the release. Without them this is skipped.
      - name: sign the Firefox add-on
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "no AMO credentials; the Firefox add-on is left unsigned"
            exit 0
          fi
          npx --yes web-ext@8 sign --source-dir extension --artifacts-dir signed \
            --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          cp signed/*.xpi x-link-collector-firefox.xpi
          shasum -a 256 x-link-collector-firefox.xpi > x-link-collector-firefox.xpi.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            x-link-collector-extension.zip
            x-link-collector-extension.zip.sha256
            x-link-collector-firefox.xpi
            x-link-collector-firefox.xpi.sha256
          if-no-files-found: warn

  publish:
    name: publish release
    needs: [archives, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release text is this version's section of CHANGELOG.md.
      - name: release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: notes.md
          draft: true
