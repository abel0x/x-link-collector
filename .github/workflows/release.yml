name: release

# Tag a version and the binaries build themselves:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl, so one static binary runs on every distribution -- Debian,
          # Ubuntu, Fedora, Arch, Alpine -- with no glibc version to match.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, label: linux-x86_64,   ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      label: macos-arm64,    ext: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,       label: macos-x86_64,   ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    label: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path receiver/Cargo.toml

      - name: package (unix)
        if: runner.os != 'Windows'
        run: |
          staging="x-link-receiver-${{ matrix.label }}"
          mkdir -p "$staging"
          cp "receiver/target/${{ matrix.target }}/release/x-link-receiver" "$staging/"
          cp LICENSE NOTICE README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          shasum -a 256 "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - name: package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = "x-link-receiver-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "receiver/target/${{ matrix.target }}/release/x-link-receiver.exe" $staging
          Copy-Item LICENSE, NOTICE, README.md $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          (Get-FileHash "$staging.zip" -Algorithm SHA256).Hash.ToLower() + "  $staging.zip" |
            Out-File -Encoding ascii "$staging.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            *.tar.gz
            *.zip
            *.sha256
          if-no-files-found: error

  extension:
    name: extension zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: zip the unpacked extension
        run: |
          cd extension
          zip -qr ../x-link-collector-extension.zip . -x 'test/*'
          cd ..
          shasum -a 256 x-link-collector-extension.zip > x-link-collector-extension.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            x-link-collector-extension.zip
            x-link-collector-extension.zip.sha256

  publish:
    name: publish release
    needs: [binaries, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: true
