name: ci

on:
  push:
    # *-wip: work pushed to be tried on all three systems before it is merged.
    branches: [main, "*-wip"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  receiver:
    name: receiver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: receiver
      - name: build
        run: cargo build --release --manifest-path receiver/Cargo.toml
      - name: test
        run: cargo test --manifest-path receiver/Cargo.toml
      - name: clippy
        run: cargo clippy --manifest-path receiver/Cargo.toml --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The built binary, started for real: captures, the panel's API, a job
      # run and stopped, quitting. On Windows this is the only place it runs.
      - name: smoke test
        shell: bash
        run: python tests/smoke.py "receiver/target/release/x-link-receiver${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --manifest-path receiver/Cargo.toml --check
      - name: static musl build (what releases ship on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path receiver/Cargo.toml
          # `file` says "static-pie linked" for a static PIE; older toolchains
          # say "statically linked". Either one means no dynamic libc.
          file receiver/target/x86_64-unknown-linux-musl/release/x-link-receiver \
            | grep -qE "static-pie linked|statically linked"

  extension:
    name: extension and panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: service worker tests
        run: node --test extension/test/
      - name: the pages' scripts parse
        run: |
          node --check extension/options.js
          node --check receiver/panel/panel.js
      - name: manifest is valid json
        run: python3 -c "import json;json.load(open('extension/manifest.json'))"

  tools:
    name: python tools (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # The oldest Python the README promises.
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: tests
        run: python -m unittest discover -s tests -v
      - name: they answer --help everywhere
        shell: bash
        run: |
          python downloader/x-download --help > /dev/null
          python spliter/x-flatten --help > /dev/null
